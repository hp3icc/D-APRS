<script>
// Función para ajustar la altura de los iframes automáticamente
function adjustIframeHeight() {
    const iframes = [
        { id: 'bulletinIframe', url: 'bulletin_board' },
        { id: 'positionsIframe', url: 'positions' }
    ];

    iframes.forEach(iframeInfo => {
        const iframe = document.getElementById(iframeInfo.id);
        
        // Usar MutationObserver para detectar cambios en el contenido
        const observer = new MutationObserver(function(mutations) {
            adjustSingleIframe(iframe);
        });

        // Configurar el observer
        if (iframe.contentDocument) {
            observer.observe(iframe.contentDocument.body, {
                childList: true,
                subtree: true,
                attributes: true,
                characterData: true
            });
        }

        // Ajustar inicialmente
        iframe.onload = function() {
            adjustSingleIframe(iframe);
            // Observar cambios después de la carga
            if (iframe.contentDocument) {
                observer.observe(iframe.contentDocument.body, {
                    childList: true,
                    subtree: true,
                    attributes: true,
                    characterData: true
                });
            }
        };
    });
}

// Función para ajustar un iframe individual
function adjustSingleIframe(iframe) {
    try {
        // Esperar un poco para que el contenido se estabilice
        setTimeout(() => {
            const contentDocument = iframe.contentDocument || iframe.contentWindow.document;
            const body = contentDocument.body;
            const html = contentDocument.documentElement;
            
            // Calcular la altura del contenido
            const height = Math.max(
                body.scrollHeight,
                body.offsetHeight,
                html.clientHeight,
                html.scrollHeight,
                html.offsetHeight
            );
            
            // Aplicar la altura con un pequeño margen
            iframe.style.height = (height + 20) + 'px';
        }, 100);
    } catch (e) {
        // Si hay error de CORS, usar altura por defecto
        console.log('No se puede ajustar automáticamente debido a CORS');
        iframe.style.height = '400px'; // Altura por defecto
    }
}

// Ajustar alturas cuando la página carga
document.addEventListener('DOMContentLoaded', function() {
    adjustIframeHeight();
    
    // También ajustar cuando la página se recarga automáticamente
    window.addEventListener('load', adjustIframeHeight);
});

// Reajustar periódicamente por si hay cambios dinámicos
setInterval(adjustIframeHeight, 2000);
</script>
